project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!dist/"
  resources:
    - data/
    - assets/

website:
  title: "五マスの人たち。"
  description: "12のペントミノと、ちょっと不思議な数学の世界。"
  navbar:
    background: "#FFF9F2"
    foreground: "#302B32"
    left:
      - text: "12人の仲間"
        href: characters/index.qmd
      - text: "おはなし"
        href: stories/index.qmd
      - text: "🧪 研究室"
        href: research/index.qmd
      - text: "🔧 ひみつの実験室"
        href: experimental/index.qmd
      - text: "ABOUT"
        href: about.qmd
  page-footer:
    border: false
    left: "五マスの人たち。"
    right: "FIVE SQUARES. TWELVE PERSONALITIES."
  search: false

format:
  html:
    theme: cosmo
    css:
      - assets/css/style.css
      - research/research.css
    toc: false
    page-layout: full
    anchor-sections: false
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false
